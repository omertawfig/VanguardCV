name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.0.1). Leave blank to use v<Cargo.toml version>."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-release:
    name: Build & Publish Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version and tag
        id: meta
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw -Path Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse package version from Cargo.toml"
          }
          $crateVersion = $Matches[1]
          $refTag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $refTag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}" -ne "") {
            $refTag = "${{ inputs.tag }}"
          } else {
            $refTag = "v$crateVersion"
          }
          $tagVersion = $refTag.TrimStart('v', 'V')
          if ($tagVersion -ne $crateVersion) {
            throw "Tag version ($tagVersion) does not match Cargo.toml version ($crateVersion)."
          }
          "version=$crateVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$refTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building VanguardCV $refTag (crate $crateVersion)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify lints and test suite
        shell: pwsh
        run: |
          cargo clippy --features ui --all-targets -- -D warnings
          cargo test --features ui --no-fail-fast

      - name: Build Windows release executable
        shell: pwsh
        run: |
          cargo build --release --features ui
          $exe = Get-Item "target\release\vanguard-cv.exe"
          Write-Host "Built $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "FileVersion: $($exe.VersionInfo.FileVersion) | ProductName: $($exe.VersionInfo.ProductName)"

      - name: Locate or install Inno Setup 6
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup 6) not found after installation."
          }
          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build Windows installer and SHA256SUMS.txt
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${{ steps.inno.outputs.iscc }}" "/DAppVersion=$version" "installer\vanguard-cv.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
          $installerName = "VanguardCV-Setup-$version-x64.exe"
          $installerPath = Join-Path "dist" $installerName
          if (-not (Test-Path $installerPath)) {
            throw "Expected installer not found at $installerPath"
          }
          $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $distDir = (Resolve-Path "dist").Path
          [System.IO.File]::WriteAllText(
            (Join-Path $distDir "SHA256SUMS.txt"),
            "$hash  $installerName`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host "Installer: $installerName"
          Write-Host "SHA-256:   $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VanguardCV-Windows-x64-${{ steps.meta.outputs.tag }}
          path: |
            dist/VanguardCV-Setup-${{ steps.meta.outputs.version }}-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $installerName = "VanguardCV-Setup-$version-x64.exe"
          $installer = "dist/$installerName"
          $sums = "dist/SHA256SUMS.txt"
          $bt = [char]96
          $fence = "$bt$bt$bt"
          $notesLines = @(
            "## VanguardCV $tag (Windows x64)",
            "",
            "### Highlights",
            "- **Windows Installer ($bt$installerName$bt)**: Clean per-user Windows 10/11 x64 setup — launches with an empty local SQLite workspace and zero pre-seeded personal data.",
            "- **Built-in Auto-Updater**: Checks GitHub Releases, verifies installer SHA-256 checksums against ${bt}SHA256SUMS.txt${bt}, and installs updates seamlessly with an on/off toggle in **Settings -> Software updates**.",
            "- **Zero-Trust PII Air-Gap**: Contact header stays strictly local; AI providers (OpenAI Sign in with ChatGPT or Google Gemini API) only receive scrubbed CV structure.",
            "- **Master CV Import (DOCX & PDF)**: Import existing CVs with automatic section/entry detection, strict No-PII contact-header exclusion, and interactive line-by-line verification before saving.",
            "- **Job Discovery & One-Click Tailoring**: Generate search profiles per CV, filter live listings by country/freshness/remote, and tailor targeted CV variations in one click.",
            "- **Native Typst PDF Export**: Instant live preview and crisp ATS-friendly PDF generation with bundled Libertinus Serif fonts.",
            "",
            "### Verification",
            "Verify the Windows installer checksum against ${bt}SHA256SUMS.txt${bt}:",
            "${fence}powershell",
            "Get-FileHash .\$installerName -Algorithm SHA256",
            "${fence}"
          )
          $notes = ($notesLines -join "`n") + "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $sums --clobber
            gh release edit $tag --title "VanguardCV $tag" --notes-file $notesFile
          } else {
            gh release create $tag $installer $sums --title "VanguardCV $tag" --notes-file $notesFile --latest
          }
