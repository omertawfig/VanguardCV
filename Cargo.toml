[features]
default = []
# Compiles the GPUI binary entry point.
ui = []

[package]
name = "vanguard-cv"
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
authors = ["Omer Tawfig"]
description = "Native GPUI AI CV studio with non-destructive parent/child CV trees and a zero-trust PII air-gap."
license-file = "LICENSE"
repository = "https://github.com/omertawfig/VanguardCV"
default-run = "vanguard-cv"

[lib]
name = "vanguard_cv"
path = "src/lib.rs"

[[bin]]
name = "vanguard-cv"
path = "src/main.rs"

[dependencies]
# Desktop UI (Wayland backend on Linux; avoids system X11 dev packages)
gpui = { version = "0.2.2", default-features = false, features = ["wayland"] }

# Async runtime
tokio = { version = "1.54", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "net",
] }
futures = "0.3"
async-trait = "0.1"

# Persistence
rusqlite = { version = "0.41", features = ["bundled", "serde_json", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# AI, OpenAI Sign in with ChatGPT (OAuth 2.0 / OIDC + PKCE + JWKS) & networking
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
eventsource-stream = "0.2"
base64 = "0.22"
sha2 = "0.10"
url = "2"
rand = "0.9"
open = "5"
jsonwebtoken = "9"

# Skills configuration
toml = "0.9"
notify = "8"
dirs = "7"

# PII redaction
regex = "1"
aho-corasick = "1.1"

# PDF compilation & CV import (DOCX / PDF)
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-render = "0.15"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"
pdf-extract = "0.12"

# Diffing, images, utilities
similar = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS keychain for persisted AI credentials (GNOME Keyring/Secret Service on Linux)
keyring = "4"

# Pinned: gpui_http_client -> zed-async-tar -> xattr 0.2.3 still references
# libc::ENOATTR, which libc removed in 0.2.190. Remove once gpui updates.
libc = "=0.2.185"

[dev-dependencies]
tempfile = "3"
ring = "0.17"

[profile.dev]
debug = 1
